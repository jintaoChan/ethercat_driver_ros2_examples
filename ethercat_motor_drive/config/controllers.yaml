controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    position_controller:
      type: position_controllers/JointGroupPositionController

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    effort_controller:
      type: effort_controllers/JointGroupEffortController

    control_pad_controller:
      type: control_pad/ControlPadController

gpio_controller:
  ros__parameters:
    type: gpio_controllers/GpioCommandController
    gpios:
      - beckhoff_output
      - beckhoff_input
    command_interfaces:
      beckhoff_output:
        - interfaces:
          - d_1
          - d_2
          - d_3
          - d_4
          - d_5
          - d_6
          - d_7
          - d_8
          - d_9
          - d_10
          - d_11
          - d_12
          - d_13
          - d_14
          - d_15
          - d_16

    state_interfaces:
      beckhoff_input:
        - interfaces:
          - d_1
          - d_2
          - d_3
          - d_4
          - d_5
          - d_6
          - d_7
          - d_8

rz_t1_gpio_controller:
  ros__parameters:
    type: gpio_controllers/GpioCommandController
    gpios:
      - rz_t1
    state_interfaces:
      rz_t1:
        - interfaces:
          - force_sensor_1
          - force_sensor_2
          - force_sensor_3
          - force_sensor_4
          - force_sensor_5
          - force_sensor_6
          - digital_input
          - analog_input1
          - analog_input2
          - temparature
          - vdc_bus

    command_interfaces:
      rz_t1:
        - interfaces:
          - digital_output


trajectory_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
    joints:
      - joint0
      - joint1

position_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
    joints:
      - joint0
      - joint1

velocity_controller:
  ros__parameters:
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - joint0
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5

effort_controller:
  ros__parameters:
    joints:
      - joint2

control_pad_controller:
  ros__parameters:
    joints:
      - joint2
      # - joint3
      # - joint4
      # - joint5
      # - joint6
    command_interfaces:
      - position
      - velocity
      - mode

    state_interfaces:
      - position
      - velocity
      - mode
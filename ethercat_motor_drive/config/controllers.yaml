controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    effort_controller:
      type: effort_controllers/JointGroupEffortController

    control_pad_controller:
      type: control_pad/ControlPadController


trajectory_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
    joints:
      - joint2
      # - joint3
      # - joint4
      # - joint5

velocity_controller:
  ros__parameters:
    joints:
      - joint2

effort_controller:
  ros__parameters:
    joints:
      - joint2

control_pad_controller:
  ros__parameters:
    joints:
      - joint2
      # - joint3
      # - joint4
      # - joint5
      # - joint6
    command_interfaces:
      - position
      - velocity
      - mode

    state_interfaces:
      - position
      - velocity
      - mode